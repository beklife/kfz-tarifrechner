apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: kfz-tarifrechner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: kfz-tarifrechner
    spec:
      containers:
        - name: frontend
          image: ghcr.io/GITHUB_USER/kfz-tarifrechner-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # nginx setzt diese Werte beim Start in seine Konfiguration ein (envsubst).
          envFrom:
            - configMapRef:
                name: kfz-tarifrechner-config
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # nginx startet in unter einer Sekunde -> keine Startup-Probe nötig.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
